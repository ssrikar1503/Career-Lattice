name: Weekly ingestion pipeline

on:
  schedule:
    # Every Monday at 10:00 AM UTC
    - cron: '0 10 * * 1'
  workflow_dispatch:
    # Allows manual trigger from GitHub Actions UI
    inputs:
      industries:
        description: 'Industries to process (space-separated, leave blank for all)'
        required: false
        default: ''
      skip_scrape:
        description: 'Skip scraping step'
        type: boolean
        default: false
      skip_extract:
        description: 'Skip extraction step'
        type: boolean
        default: false
      skip_match:
        description: 'Skip matching step'
        type: boolean
        default: false

jobs:
  ingest:
    name: Run pipeline
    runs-on: ubuntu-latest
    # 5 hours — well within GitHub Actions' 6h cap. Sized so the full backlog
    # can clear in one run when Groq is the primary provider (~3-4 hr typical).
    timeout-minutes: 300

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: apps/pipeline/requirements.txt

      - name: Install pipeline dependencies
        run: pip install -r apps/pipeline/requirements.txt

      - name: Build CLI arguments
        id: args
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.industries }}" ]; then
            ARGS="$ARGS --industries ${{ github.event.inputs.industries }}"
          fi
          if [ "${{ github.event.inputs.skip_scrape }}" = "true" ]; then
            ARGS="$ARGS --skip-scrape"
          fi
          if [ "${{ github.event.inputs.skip_extract }}" = "true" ]; then
            ARGS="$ARGS --skip-extract"
          fi
          if [ "${{ github.event.inputs.skip_match }}" = "true" ]; then
            ARGS="$ARGS --skip-match"
          fi
          echo "cli_args=$ARGS" >> $GITHUB_OUTPUT

      # Connect to Cloud SQL from the runner via the Cloud SQL Auth Proxy.
      # Required repo secrets:
      #   GCP_SA_KEY         - JSON key for a service account with the
      #                        "Cloud SQL Client" role (roles/cloudsql.client)
      #   CLOUD_SQL_INSTANCE - instance connection name PROJECT:REGION:INSTANCE
      #   DATABASE_URL       - postgresql://USER:PASSWORD@127.0.0.1:5432/careerlattice
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Start Cloud SQL Auth Proxy
        run: |
          curl -sL -o cloud-sql-proxy \
            https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.14.1/cloud-sql-proxy.linux.amd64
          chmod +x cloud-sql-proxy
          ./cloud-sql-proxy --port 5432 "${{ secrets.CLOUD_SQL_INSTANCE }}" &
          # Wait until the proxy accepts TCP connections before continuing.
          for i in $(seq 1 15); do
            (exec 3<>/dev/tcp/127.0.0.1/5432) 2>/dev/null && { exec 3>&-; break; }
            sleep 1
          done

      - name: Run ingestion pipeline
        working-directory: apps/pipeline
        env:
          DATABASE_URL:      ${{ secrets.DATABASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GROQ_API_KEY:      ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY:    ${{ secrets.GEMINI_API_KEY }}
        run: python main.py ${{ steps.args.outputs.cli_args }}

      - name: Upload pipeline log
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: pipeline-log-${{ github.run_id }}
          path: apps/pipeline/*.log
          if-no-files-found: ignore
          retention-days: 14
